<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visionary Business 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            overflow-x: hidden;
            opacity: 0; 
            transition: opacity 0.6s ease; 
        }
        body.loaded { opacity: 1; }
        
        /* Grid Background Halus */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
            position: absolute;
            inset: 0;
            z-index: -2;
        }

        .blob { 
            position: absolute; 
            filter: blur(90px); 
            opacity: 0.4; 
            animation: float 10s infinite alternate; 
            z-index: -1; 
        }
        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 40px); } }

        .hero-text { 
            background: linear-gradient(to right, #22d3ee, #818cf8); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0 0 40px rgba(34, 211, 238, 0.2); 
        }

        .glass-nav { 
            background: rgba(2, 6, 23, 0.8); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }

        /* Animasi Gambar */
        .floating-img { animation: float-img 6s ease-in-out infinite; }
        @keyframes float-img {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-black relative flex flex-col min-h-[100dvh]">

    <div class="bg-grid"></div>
    <div class="blob bg-blue-600 w-64 h-64 md:w-96 md:h-96 rounded-full top-0 left-0"></div>
    <div class="blob bg-purple-600 w-64 h-64 md:w-96 md:h-96 rounded-full bottom-0 right-0 animation-delay-2000"></div>

    <nav class="fixed w-full z-50 glass-nav">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center w-full">
            <a href="index.html" class="text-xl md:text-2xl font-bold tracking-tighter z-50 relative flex items-center gap-1 shrink-0">
                Visio<span class="text-cyan-400">Bus</span>26
            </a>
            
            <div class="hidden md:flex space-x-8 text-sm font-semibold items-center">
                <a href="trends.html" class="hover:text-cyan-400 transition">Tren Bisnis</a>
                <a href="ideas.html" class="hover:text-cyan-400 transition">Ide Bisnis</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow w-full max-w-7xl mx-auto px-6 pt-32 pb-16 flex flex-col md:flex-row items-center justify-center gap-12 relative">
        
        <div class="text-center md:text-left z-10 w-full md:w-1/2">
            
            <div class="inline-flex items-center gap-2 px-3 py-1.5 mb-6 rounded-full border border-cyan-500/30 bg-cyan-950/30 text-cyan-300 text-[10px] md:text-xs font-bold tracking-widest uppercase shadow-[0_0_10px_rgba(34,211,238,0.15)] mx-auto md:mx-0">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                </span>
                Roadmap 2026
            </div>
            
            <h1 class="text-[2.75rem] leading-[1.1] sm:text-5xl md:text-7xl font-extrabold mb-6 tracking-tight">
                Zaman Emas <br>
                <span class="hero-text">Digital 2026.</span>
            </h1>

            <p class="text-slate-400 text-sm sm:text-base md:text-lg mb-8 leading-relaxed max-w-md mx-auto md:mx-0">
                Algoritma sekarang memihak kreator kecil. Temukan peluang bisnis tanpa modal dari rumah sebelum kompetisi semakin ketat.
            </p>

            <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto justify-center md:justify-start">
                <a href="ideas.html" class="group w-full sm:w-auto px-6 py-3.5 bg-white text-slate-950 rounded-xl font-bold transition hover:bg-cyan-50 active:scale-95 shadow-[0_0_20px_rgba(255,255,255,0.2)] flex items-center justify-center gap-2 text-sm sm:text-base">
                    <i class="fas fa-bolt text-yellow-500 group-hover:animate-pulse"></i> 
                    Lihat Ide Bisnis
                </a>
                
                <a href="trends.html" class="w-full sm:w-auto px-6 py-3.5 bg-slate-800/40 border border-slate-700 hover:border-cyan-500/50 hover:bg-slate-800/80 rounded-xl font-bold transition active:scale-95 backdrop-blur-sm text-slate-300 flex items-center justify-center gap-2 text-sm sm:text-base">
                    Analisa Tren <i class="fas fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
                </a>
            </div>
        </div>

        <div class="relative w-full md:w-1/2 h-[300px] md:h-[500px] hidden md:block">
            <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500/20 to-purple-500/20 rounded-full blur-3xl transform scale-75"></div>
            
            <div class="relative z-10 w-full h-full rounded-2xl overflow-hidden border border-slate-700/50 shadow-2xl floating-img group bg-slate-900/50 backdrop-blur-sm">
                <img src="gambar index.png" 
                     alt="Future Business" 
                     class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition duration-700">
            </div>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => document.body.classList.add("loaded"));
        
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', e => {
                if(link.getAttribute('href') && !link.getAttribute('href').startsWith('#')) {
                    e.preventDefault();
                    const target = link.href;
                    document.body.style.opacity = 0;
                    setTimeout(() => window.location.href = target, 500);
                }
            });
        });
    </script>
</body>
</html>
