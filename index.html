<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visionary Business 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            overflow-x: hidden; 
            width: 100vw;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        body.loaded { opacity: 1; }
        
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }

        .hero-text { 
            background: linear-gradient(to right, #22d3ee, #818cf8); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0 0 30px rgba(34, 211, 238, 0.3); 
        }

        .glass-nav { 
            background: rgba(2, 6, 23, 0.85); 
            backdrop-filter: blur(16px); 
            border-bottom: 1px solid rgba(255,255,255,0.08); 
        }
        
        .floating-img { animation: float-img 6s ease-in-out infinite; }
        @keyframes float-img { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-black relative flex flex-col min-h-screen">

    <div class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none -z-10">
        <div class="bg-grid absolute inset-0"></div>
        <div class="absolute bg-blue-600 w-64 h-64 rounded-full top-[-50px] left-[-50px] blur-[80px] opacity-40"></div>
        <div class="absolute bg-purple-600 w-64 h-64 rounded-full bottom-[-50px] right-[-50px] blur-[80px] opacity-40"></div>
    </div>

    <nav class="fixed w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center w-full">
            <a href="index.html" class="text-xl md:text-2xl font-bold tracking-tighter z-50 flex items-center gap-1 shrink-0 relative">
                Visio<span class="text-cyan-400">Bus</span>26
            </a>
            
            <div class="hidden md:flex space-x-8 text-sm font-semibold items-center">
                <a href="trends.html" class="hover:text-cyan-400 transition">Tips Sukses</a>
                <a href="ideas.html" class="hover:text-cyan-400 transition">Ide Bisnis</a>
            </div>

            <button onclick="toggleSidebar()" class="md:hidden text-white p-2 z-50 focus:outline-none">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </div>
    </nav>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden transition-opacity duration-300 opacity-0"></div>

    <div id="mobile-sidebar" class="fixed top-0 right-0 h-full w-64 bg-slate-900/95 border-l border-slate-800 z-50 transform translate-x-full transition-transform duration-300 ease-in-out shadow-2xl">
        <div class="p-6 flex flex-col h-full">
            <div class="flex justify-end mb-8">
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white transition p-2">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
            
            <div class="flex flex-col space-y-6">
                <a href="index.html" class="text-lg font-bold text-cyan-400 border-l-4 border-cyan-400 pl-4 bg-cyan-900/10 py-2 rounded-r">Home</a>
                <a href="ideas.html" class="text-lg font-semibold text-slate-300 hover:text-white hover:border-l-4 hover:border-slate-500 pl-4 transition-all">Katalog Ide</a>
                <a href="trends.html" class="text-lg font-semibold text-slate-300 hover:text-white hover:border-l-4 hover:border-slate-500 pl-4 transition-all">Tren 2026</a>
            </div>

            <div class="mt-auto pt-8 border-t border-slate-800">
                <p class="text-xs text-slate-500 text-center">© 2026 VisioBus</p>
            </div>
        </div>
    </div>

    <main class="flex-grow w-full max-w-7xl mx-auto px-5 pt-28 md:pt-32 pb-12 flex flex-col md:flex-row items-center justify-center gap-8 md:gap-10">
        
        <div class="text-center md:text-left z-10 w-full md:w-1/2 order-2 md:order-1">
            <div class="inline-flex items-center gap-2 px-3 py-1 mb-4 md:mb-6 rounded-full border border-cyan-500/30 bg-cyan-950/40 text-cyan-300 text-[10px] md:text-xs font-bold tracking-widest uppercase">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                </span>
                Roadmap 2026
            </div>
            
            <h1 class="text-4xl sm:text-5xl md:text-7xl font-extrabold mb-4 md:mb-6 leading-tight tracking-tight">
                Zaman Emas <br>
                <span class="hero-text">Digital 2026.</span>
            </h1>

            <p class="text-slate-400 text-sm sm:text-base leading-relaxed max-w-md mx-auto md:mx-0 mb-8">
                Algoritma sekarang memihak kreator kecil. Temukan peluang bisnis tanpa modal dari rumah.
            </p>

            <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto justify-center md:justify-start">
                <a href="ideas.html" class="w-full sm:w-auto px-6 py-3.5 bg-white text-slate-950 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg active:scale-95 transition">
                    <i class="fas fa-bolt text-yellow-500"></i> Lihat Ide Bisnis
                </a>
                <a href="trends.html" class="w-full sm:w-auto px-6 py-3.5 bg-slate-800/50 border border-slate-700 text-slate-300 rounded-xl font-bold flex items-center justify-center gap-2 active:scale-95 transition hover:bg-slate-800">
                    Analisa Tren <i class="fas fa-arrow-right text-xs"></i>
                </a>
            </div>
        </div>

        <div class="relative w-full md:w-1/2 h-[280px] md:h-[500px] block order-1 md:order-2">
            <div class="relative z-10 w-full h-full rounded-2xl overflow-hidden border border-slate-700/50 shadow-2xl floating-img">
                <img src="gambar index.png" 
                     class="w-full h-full object-cover opacity-80" 
                     alt="Future Digital Business">
            </div>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => document.body.classList.add("loaded"));
        
        // Page Transition
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', e => {
                if(link.getAttribute('href') && !link.getAttribute('href').startsWith('#')) {
                    e.preventDefault();
                    const target = link.href;
                    document.body.style.opacity = 0;
                    setTimeout(() => window.location.href = target, 500);
                }
            });
        });

        // Sidebar Logic
        function toggleSidebar() {
            const sidebar = document.getElementById('mobile-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const body = document.body;
            
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                body.style.overflow = 'hidden'; 
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
                body.style.overflow = 'auto'; 
            }
        }
    </script>
</body>
</html>
